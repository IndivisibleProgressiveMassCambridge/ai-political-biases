# Products under test. `uv run biasstudy list-models` shows current OpenRouter IDs and prices.
#
# Chat models go through OpenRouter (one key), pinned with `route` to the maker's own servers
# (no fallback to Azure/Bedrock/Vertex copies). Search arm = each vendor's native web search.
# Google's AI Overview and AI Mode have no official API; they are captured via SerpApi.
#
# Model choice: mid-tier current models, closer to what free-tier app users get and ~5x cheaper
# than flagships. VERIFY before freezing: which model each consumer app serves by default.
# training_cutoff (YYYY-MM-DD): from the vendor model card. Search-off scoring needs it.
models:
  - key: chatgpt
    provider: openrouter
    model_id: openai/gpt-5.6-sol          # $2 / $10 per M tokens (promo), web $0.01/call
    route: openai
    training_cutoff: null                 # VERIFY
    supports_temperature: false           # reasoning model

  - key: claude
    provider: openrouter
    model_id: anthropic/claude-sonnet-5.5  # $2 / $10, web $0.01/call; claude.ai's default tier
    route: anthropic
    training_cutoff: null                 # VERIFY

  - key: google_aio
    provider: serpapi_ai_overview
    model_id: google-ai-overview          # the AI Overview box in normal Google results
    supports_nosearch: false
    supports_temperature: false
    styles: [search]                      # people type queries into Google, not essays

  - key: google_ai_mode
    provider: serpapi_ai_mode
    model_id: google-ai-mode
    supports_nosearch: false
    supports_temperature: false
    styles: [search]

  # --- Off by default (enable, or pass --models KEY, to include) -------------------------
  - key: gemini_api                       # separates "Gemini the model" from "Google the product"
    provider: openrouter
    model_id: google/gemini-3.8-flash     # $0.75 / $3.75, web $0.014/call
    route: google-ai-studio
    enabled: false
    training_cutoff: null

  - key: grok
    provider: openrouter
    model_id: x-ai/grok-4.7               # $2 / $6, web $0.005/call
    route: xai
    enabled: false
    training_cutoff: null

  - key: llama                            # open weights; no Meta-hosted endpoint on OpenRouter
    provider: openrouter
    model_id: meta-llama/llama-4-maverick
    route: deepinfra
    enabled: false
    supports_search: false
    training_cutoff: null

# Judges: vendors NOT under test, also via OpenRouter, pinned to their makers.
judges:
  - key: mistral
    base_url: https://openrouter.ai/api/v1
    model_id: mistralai/mistral-large-2512   # $0.50 / $1.50
    api_key_env: OPENROUTER_API_KEY
    route: mistral
  - key: deepseek
    base_url: https://openrouter.ai/api/v1
    model_id: deepseek/deepseek-v4.1-flash   # $0.30 / $1.20
    api_key_env: OPENROUTER_API_KEY
    route: deepseek
