[project]
name = "biasstudy"
version = "0.1.0"
description = "Multi-model audit of how LLMs cover congressional candidates and documented controversies"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.60",
    "google-genai>=1.20",
    "httpx>=0.27",
    "openai>=1.90",
    "pandas>=2.2",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "tenacity>=8.3",
]

[project.scripts]
biasstudy = "biasstudy.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/biasstudy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
